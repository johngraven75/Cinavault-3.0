name: CinaVault 3.0 OS Edition Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cinavault-3-os-edition-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows edition
    if: github.repository == 'johngraven75/Cinavault-3.0'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and source
        run: npm run verify:preflight

      - name: Build frontend
        run: npm run build

      - name: Prepare Windows resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run prepare:wireguard:windows
          New-Item -ItemType Directory -Force -Path src-tauri/tools/cloudflared | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile src-tauri/tools/cloudflared/cloudflared.exe
          if ((Get-Item src-tauri/tools/cloudflared/cloudflared.exe).Length -lt 10000000) {
            throw 'cloudflared binary is unexpectedly small.'
          }

      - name: Build Windows bundles
        run: npm run tauri:build:windows

      - name: Upload Windows bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-3-windows-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30

  ubuntu-linux:
    name: Ubuntu Linux edition
    if: github.repository == 'johngraven75/Cinavault-3.0-Linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and source
        run: npm run verify:preflight

      - name: Build frontend
        run: npm run build

      - name: Build Ubuntu packages
        run: npm run tauri:build:linux:ubuntu

      - name: Upload Ubuntu bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-3-ubuntu-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android edition
    if: github.repository == 'johngraven75/Cinavault-3.0-Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and source
        run: npm run verify:preflight

      - name: Initialize Android project when missing
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run android:init
          fi

      - name: Build Android package
        run: npm run android:build

      - name: Upload Android bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-3-android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/**/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS edition
    if: github.repository == 'johngraven75/Cinavault-3.0-iOS'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and source
        run: npm run verify:preflight

      - name: Initialize iOS project when missing
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npm run ios:init
          fi

      - name: Build iOS package
        run: npm run ios:build

      - name: Upload iOS build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-3-ios-${{ github.sha }}
          path: src-tauri/gen/apple/build/**/*
          if-no-files-found: warn
          retention-days: 30
